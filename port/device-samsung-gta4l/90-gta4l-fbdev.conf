# Desktop OpenGL remains software rendered; the isolated Turnip KGSL driver
# provides Vulkan rendering. Bring up Xfce through vendor DRM. The local
# modesetting package guards properties without initialized RandR atoms.
Section "Device"
    Identifier "SM-T505 display"
    Driver "modesetting"
    Option "kmsdev" "/dev/dri/card0"
    Option "AccelMethod" "none"
    Option "SWcursor" "true"
    Option "ShadowFB" "true"
    Option "PageFlip" "false"
EndSection
Section "Monitor"
    Identifier "DSI-1"
    Option "Rotate" "inverted"
EndSection
