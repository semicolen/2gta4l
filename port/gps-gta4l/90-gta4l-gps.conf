# Hardware GPS through ModemManager. Location clients retain normal consent.
[modem-gps]
enable=true

[ip]
enable=false

[wifi]
enable=false
submit-data=false

[3g]
enable=false

[cdma]
enable=false

[network-nmea]
enable=false

[static-source]
enable=false

# Compass is a separate unverified feature on this device.
[compass]
enable=false
