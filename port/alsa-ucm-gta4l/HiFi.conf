# The matching T505XXS8CXG1 stock configuration routes deep-buffer
# playback through PRI_MI2S_RX. The kernel's FSM codec loads fs1801.fsm
# and controls the four amplifiers when this backend starts and stops.
# Keep its stock protection, calibration, scene and amplifier gain.
SectionVerb {
	EnableSequence [
		# This downstream DPCM frontend rejects hw_params without an
		# enabled backend. Enable it before the audio server probes PCM.
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' on,on"
		cset "name='PRIM_MI2S_RX SampleRate' KHZ_48"
		cset "name='PRIM_MI2S_RX Format' S16_LE"
		cset "name='PRIM_MI2S_RX Channels' Two"
		# The DSP gain's maximum 0x2000 is unity. Do not export the
		# vendor's inaccurate ALSA dB metadata as a volume control;
		# the desktop audio server supplies software volume instead.
		cset "name='Playback 0 Volume' 8192"
		cset "name='Capture 0 Volume' 8192"
		# The QRD capture frontend also needs its backend before PCM probing.
		cset "name='TX_CDC_DMA_TX_3 SampleRate' KHZ_48"
		cset "name='TX_CDC_DMA_TX_3 Format' S16_LE"
		cset "name='TX_CDC_DMA_TX_3 Channels' One"
		# A connected capture backend must have its codec path ready even
		# while PulseAudio probes the playback side of this shared frontend.
		cset "name='TX DEC2 MUX' SWR_MIC"
		cset "name='TX SMIC MUX2' SWR_MIC0"
		cset "name='TX_AIF1_CAP Mixer DEC2' on"
		cset "name='ADC1 Volume' 10"
		cset "name='ADC1_MIXER Switch' on"
		cset "name='MultiMedia1 Mixer TX_CDC_DMA_TX_3' on"
	]
	DisableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' off,off"
		cset "name='MultiMedia1 Mixer TX_CDC_DMA_TX_3' off"
		cset "name='ADC1_MIXER Switch' off"
		cset "name='TX_AIF1_CAP Mixer DEC2' off"
		cset "name='TX SMIC MUX2' ZERO"
		cset "name='TX DEC2 MUX' MSM_DMIC"
	]
	Value {
		TQ "HiFi"
	}
}

# Matching stock mixer_paths_qrd.xml: audio-record + amic1, with its default
# ADC1 gain. The internal microphone is on SoundWire channel 0. Keep codec
# bias control in the driver; desktop capture uses software volume.
SectionDevice."Mic" {
	Comment "Internal microphone"
	EnableSequence [
		cset "name='TX DEC2 MUX' SWR_MIC"
		cset "name='TX SMIC MUX2' SWR_MIC0"
		cset "name='TX_CDC_DMA_TX_3 Channels' One"
		cset "name='TX_AIF1_CAP Mixer DEC2' on"
		cset "name='ADC1 Volume' 10"
		cset "name='ADC1_MIXER Switch' on"
		cset "name='MultiMedia1 Mixer TX_CDC_DMA_TX_3' on"
	]
	DisableSequence [
		cset "name='MultiMedia1 Mixer TX_CDC_DMA_TX_3' off"
		cset "name='ADC1_MIXER Switch' off"
		cset "name='TX_AIF1_CAP Mixer DEC2' off"
		cset "name='TX SMIC MUX2' ZERO"
		cset "name='TX DEC2 MUX' MSM_DMIC"
	]
	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},0"
		CaptureChannels 1
		CaptureRate 48000
	}
}

SectionDevice."Speaker" {
	Comment "Tablet speakers"
	EnableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' on,on"
	]
	DisableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' off,off"
	]
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackRate 48000
	}
}
